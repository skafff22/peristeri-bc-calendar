
name: Update Peristeri BC Calendar

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run calendar updater
        run: python update_calendar.py

      - name: Commit calendar changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add peristeri.ics
          if ! git diff --cached --quiet; then
            git commit -m "Update Peristeri BC calendar"
            git push
          fi
